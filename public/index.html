<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Robots (permite indexarea și urmărirea linkurilor) -->
    <meta name="robots" content="index, follow" />

    <!-- Author -->
    <meta name="author" content="Trevi Chauffeurs" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://trevi-chauffeurs.com" />

    <!-- Title & Description -->
    <title>Trevi Chauffeurs</title>
    <meta
      name="description"
      content="Trevi Chauffeurs offers premium chauffeur services and luxury car rentals across Italy. Travel in elegance, style, and comfort with professional English-speaking drivers. Whether for business or leisure, we provide a high-end experience tailored to your needs. Book your private car and driver in Rome, Milan, Florence, Venice, or anywhere in Italy today."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="chauffeur Italy, luxury car rental Italy, private driver Italy, airport transfer Rome, business travel Italy, Trevi Chauffeurs, premium transport Italy, Italian chauffeur service"
    />

    <!-- Favicon & Logo -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trevi-chauffeurs.com" />
    <meta
      property="og:title"
      content="Trevi Chauffeurs - Premium Chauffeur Services in Italy"
    />
    <meta
      property="og:description"
      content="Luxury chauffeur-driven cars across Italy for business and leisure. Travel with elegance, comfort, and professionalism."
    />
    <meta
      property="og:image"
      content="https://trevi-chauffeurs.com/og-image.jpg"
    />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trevi-chauffeurs.com" />
    <meta
      name="twitter:title"
      content="Trevi Chauffeurs - Luxury Car Rental with Driver in Italy"
    />
    <meta
      name="twitter:description"
      content="Book your premium chauffeur in Italy. Elegant transport for business or leisure with English-speaking drivers."
    />
    <meta
      name="twitter:image"
      content="https://trevi-chauffeurs.com/og-image.jpg"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Trevi Chauffeurs",
        "url": "https://trevi-chauffeurs.com",
        "logo": "https://trevi-chauffeurs.com/logo.svg",
        "image": "https://trevi-chauffeurs.com/og-image.jpg",
        "description": "Trevi Chauffeurs provides high-end chauffeur services and luxury car rentals across Italy. Reliable, elegant, and tailored to your needs.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IT"
        },
        "areaServed": ["Rome", "Milan", "Florence", "Venice", "Italy"],
        "telephone": "+393662629902",
        "priceRange": "€20 - €800",
        "openingHours": "Mo-Su 00:00-23:59"
      }
    </script>

    <!-- Performance Optimizations -->
    <link
      rel="preload"
      href="/logo.svg"
      as="image"
      type="image/svg+xml"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div aria-busy="true" class="loading-container" aria-live="polite">
        <span class="loader"></span>
      </div>
    </div>
  </body>
</html>
