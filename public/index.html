<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Basic Meta Tags -->
    <title>
      Italy Transfers - Professional Private Transportation Services
    </title>
    <meta
      name="description"
      content="Professional private transfer services across Italy. Luxury vans, sedans, and business class vehicles. Airport transfers, city tours, and corporate transportation."
    />
    <meta
      name="keywords"
      content="Italy transfers, private transportation, airport transfers, luxury car service, chauffeur service, Italy travel"
    />
    <meta name="author" content="DVC Chauffeurs" />
    <meta name="robots" content="index, follow" />

    <!-- Preload critical resources -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
    /></noscript>

    <!-- Preload critical images -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/about1.webp" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/v_class.png" />

    <!-- Critical CSS -->
    <style>
      /* Critical CSS for above-the-fold content */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Instrument Sans", sans-serif;
        overflow-x: hidden;
      }
      .header {
        position: relative;
      }
      .slider-container {
        position: relative;
      }
      .custom {
        width: 100%;
        height: calc(100vh - 124px);
        display: flex !important;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        background-position: left;
        background-repeat: no-repeat;
        background-size: cover;
        padding: 24px;
        padding-bottom: 80px;
      }
      .custom h1 {
        font-size: 40px;
        font-weight: bold;
        margin-bottom: 12px;
        color: #efefef;
      }
      .custom p {
        width: 100%;
        max-width: 520px;
        font-size: 16px;
        color: #efefef;
        margin-bottom: 16px;
      }
      .buttons {
        width: 640px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: center;
        gap: 32px;
      }
    </style>

    <!-- Defer non-critical CSS -->
    <link
      rel="preload"
      href="%PUBLIC_URL%/static/css/main.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript
      ><link rel="stylesheet" href="%PUBLIC_URL%/static/css/main.css"
    /></noscript>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://italytransfers.com/" />
    <meta
      property="og:title"
      content="Italy Transfers - Professional Private Transportation Services"
    />
    <meta
      property="og:description"
      content="Professional private transfer services across Italy. Luxury vans, sedans, and business class vehicles."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://italytransfers.com/" />
    <meta
      property="twitter:title"
      content="Italy Transfers - Professional Private Transportation Services"
    />
    <meta
      property="twitter:description"
      content="Professional private transfer services across Italy."
    />
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://italytransfers.com/" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Basic Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Italy Transfers - DVC Chauffeurs",
        "description": "Professional private transfer services across Italy",
        "url": "https://italytransfers.com",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IT"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 41.9028,
          "longitude": 12.4964
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loading">Loading Italy Transfers...</div>
    </div>
  </body>
</html>
